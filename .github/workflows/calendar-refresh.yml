name: Refresh official calendar snapshots
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-calendar-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and persist official BLS and EU schedules
        env:
          ATLAS_BASE_URL: ${{ vars.ATLAS_BASE_URL || 'https://alu-tech-atlas.alumgs-lab-b74ee9.workers.dev' }}
          ATLAS_ACCESS_PASSWORD: ${{ secrets.ATLAS_ACCESS_PASSWORD }}
        run: node scripts/calendar-ingest.mjs
