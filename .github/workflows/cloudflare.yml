name: Validate and deploy Atlas to Cloudflare
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm deploy:check
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-worker
          path: dist/
          retention-days: 7
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: atlas-worker
          path: dist/
      - name: Check deployment settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ATLAS_ACCESS_PASSWORD: ${{ secrets.ATLAS_ACCESS_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          for (const name of ['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','ATLAS_ACCESS_PASSWORD']) {
            if (!process.env[name]) throw new Error('Missing repository Actions secret: '+name);
          }
          if(process.env.ATLAS_ACCESS_PASSWORD.length<12)throw new Error('ATLAS_ACCESS_PASSWORD needs at least 12 characters');
          NODE
      - name: Deploy Worker (fails closed until authentication is provisioned)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm deploy
      - name: Configure password access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ATLAS_ACCESS_PASSWORD: ${{ secrets.ATLAS_ACCESS_PASSWORD }}
        run: node scripts/provision-auth.mjs
      - name: Verify production
        env:
          ATLAS_BASE_URL: ${{ vars.ATLAS_BASE_URL || 'https://alu-tech-atlas.alumgs-lab-b74ee9.workers.dev' }}
          ATLAS_ACCESS_PASSWORD: ${{ secrets.ATLAS_ACCESS_PASSWORD }}
        run: node scripts/smoke.mjs
