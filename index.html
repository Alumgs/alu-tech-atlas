<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="description" content="知域 Technology Atlas：AIDC、具身智能与机器学习的专业技术杂志、知识地图、案例实验室与每日技术情报。" />
  <meta name="theme-color" content="#f3f1ec" />
  <title>知域 · Technology Atlas</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="./?domain=home&view=today" aria-label="Technology Atlas 首页">
      <span class="brand-glyph">A</span>
      <span class="brand-copy"><b>知域</b><small>TECHNOLOGY ATLAS</small></span>
    </a>
    <nav class="topnav" aria-label="一级领域">
      <button data-domain="home">今日</button>
      <button data-domain="aidc">AIDC</button>
      <button data-domain="embodied">具身智能</button>
      <button data-domain="ml">机器学习</button>
    </nav>
    <div class="top-actions">
      <button class="round-btn" id="searchBtn" aria-label="搜索">⌕</button>
      <button class="round-btn" id="themeBtn" aria-label="切换主题">◐</button>
    </div>
  </header>

  <main id="app" class="shell" aria-live="polite"></main>

  <nav class="mobile-dock" aria-label="移动端导航">
    <button data-mobile-go="home,today"><span>⌂</span>今日</button>
    <button data-mobile-go="aidc,knowledge"><span>▦</span>AIDC</button>
    <button data-mobile-go="embodied,knowledge"><span>◇</span>具身</button>
    <button data-mobile-go="ml,knowledge"><span>⌘</span>ML</button>
  </nav>

  <footer class="footer">
    <div>
      <strong>知域 · Technology Atlas</strong>
      <span>专业知识 · 可靠来源 · 持续观察</span>
    </div>
    <div>
      <span id="footerUpdated">内容核验：—</span>
      <span>GitHub Pages · Daily Intelligence</span>
    </div>
  </footer>

  <dialog id="searchDialog" class="search-dialog">
    <div class="search-head">
      <div><span class="micro">SEARCH / ATLAS</span><strong>搜索整个知识地图</strong></div>
      <button id="closeSearch" aria-label="关闭">×</button>
    </div>
    <input id="globalSearch" type="search" placeholder="搜索液冷、世界模型、Agent、企业或技术变化……" autocomplete="off" />
    <div id="searchResults" class="search-results"></div>
  </dialog>

  <script src="./data/content.js"></script>
  <script src="./app.js" defer></script>
</body>
</html>
